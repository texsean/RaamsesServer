; PlatformIO project for Raamses display devices
; 5 environments: CYD, Cardputer, Core2, StickC, Watchy
; All share src/ codebase — platform/board/lib_deps differ per env

[platformio]
src_dir = src
boards_dir = boards
default_envs = cyd

[common]
build_flags =
  -D GATEWAY_IP=\"192.168.6.230\"
  -D GATEWAY_PORT=8765
  -D WIFI_SSID=\"${sysenv.WIFI_SSID}"
  -D WIFI_PASS=\"${sysenv.WIFI_PASS}"
  -D HEARTBEAT_INTERVAL_MS=15000
  -D REGISTER_RETRY_COUNT=3
  -D REGISTER_RETRY_DELAY_MS=2000
  -D JSON_DOC_SIZE=1024
  -D SCREEN_UPDATE_INTERVAL_MS=5000
  -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200

; ============================================================
; CYD — Cheap Yellow Display (ESP32 + ILI9341 320x240 TFT)
; ============================================================
[env:cyd]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
build_flags =
  ${common.build_flags}
  -D DEVICE_TYPE=\"cyd\"
  -D DEVICE_ID=\"cyd-001\"
  -D SCREEN_WIDTH=320
  -D SCREEN_HEIGHT=240
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TOUCH_CS=-1
lib_deps =
  ${common.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
monitor_speed = 115200

; ============================================================
; M5Stack Cardputer (ESP32-S3 + keyboard + 1.14" IPS)
; ============================================================
[env:cardputer]
platform = espressif32@^6.7.0
board = m5stack-stamps3
framework = arduino
build_flags =
  ${common.build_flags}
  -D DEVICE_TYPE=\"cardputer\"
  -D DEVICE_ID=\"cardputer-01\"
  -D SCREEN_WIDTH=240
  -D SCREEN_HEIGHT=135
  -D HAS_KEYBOARD=1
  -D M5_LCD_MISO=38
  -D M5_LCD_MOSI=37
  -D M5_LCD_SCLK=36
  -D M5_LCD_CS=44
  -D M5_LCD_DC=43
  -D M5_LCD_RST=-1
  -D M5_LCD_BL=46
lib_deps =
  ${common.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
  m5stack/M5Cardputer@^1.0.0
monitor_speed = 115200

; ============================================================
; M5Stack Core2 (ESP32 + 2" touch LCD + IMU)
; ============================================================
[env:core2]
platform = espressif32@^6.7.0
board = m5stack-core2
framework = arduino
build_flags =
  ${common.build_flags}
  -D DEVICE_TYPE=\"core2\"
  -D DEVICE_ID=\"core2-01\"
  -D SCREEN_WIDTH=320
  -D SCREEN_HEIGHT=240
  -D HAS_TOUCH=1
lib_deps =
  ${common.lib_deps}
  m5stack/M5Core2@^0.1.0
monitor_speed = 115200

; ============================================================
; M5Stack StickC Plus2 (ESP32 + 0.96" TFT + buttons)
; ============================================================
[env:stickc]
platform = espressif32@^6.7.0
board = m5stick-c
framework = arduino
build_flags =
  ${common.build_flags}
  -D DEVICE_TYPE=\"stickc\"
  -D DEVICE_ID=\"stickc-01\"
  -D SCREEN_WIDTH=80
  -D SCREEN_HEIGHT=160
  -D HAS_BUTTON=1
lib_deps =
  ${common.lib_deps}
  m5stack/M5StickCPlus2@^0.0.1
monitor_speed = 115200

; ============================================================
; Watchy 2.0 (ESP32 + 1.28" e-paper, deep sleep)
; ============================================================
[env:watchy]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
build_flags =
  ${common.build_flags}
  -D DEVICE_TYPE=\"watch\"
  -D DEVICE_ID=\"watchy-01\"
  -D SCREEN_WIDTH=200
  -D SCREEN_HEIGHT=200
  -D IS_EINK=1
  -D DEEP_SLEEP_SEC=300
  -D WATCHY_EPD_CS=5
  -D WATCHY_EPD_DC=10
  -D WATCHY_EPD_RST=9
  -D WATCHY_EPD_BUSY=19
  -D WATCHY_EPD_SCK=18
  -D WATCHY_EPD_MOSI=23
lib_deps =
  ${common.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
monitor_speed = 115200