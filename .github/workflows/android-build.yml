name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x src/android/gradlew || true

      - name: Build Debug APK
        working-directory: src/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        working-directory: src/android
        run: ./gradlew assembleRelease --stacktrace || true

      - name: List generated APKs
        run: find src/android -name "*.apk" -type f || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Raamses-Debug
          path: |
            src/android/app/build/outputs/apk/debug/*.apk
            src/android/app/build/outputs/apk/debug/

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Raamses-Release
          path: src/android/app/build/outputs/apk/release/*.apk
